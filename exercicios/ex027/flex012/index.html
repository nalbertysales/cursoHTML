<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexible box</title>
    <style>
      body {
        background-color: rgb(117, 117, 117);
      }
      div.conteiner {
        background-color: lightsalmon;

        display: flex;
        flex-flow: row nowrap;
      }

      div.item {
        background-color: lightskyblue;
        border: 1px solid black;
        text-align: center;
      }

      div#i1 {
        /* flex-grow: 0;
        flex-shrink: 1;
        flex-basis: 350px; */

        flex: 0 1 350px;
      }
      div#i2 {
        /* flex-grow: 2;
        flex-shrink: 0;
        flex-basis: 350px; */

        flex: 2 0 350px;
      }
      div#i3 {
        /* flex-grow: 1;
        flex-shrink: 8;
        flex-basis: 350px; */

        flex: 1 8 350px;
      }

      /* Para simplificar e deixar menos poluido usar o exemplo:
      flex =  0 1 150px
      a ordem é : flex = flex-grow + flex-shrink + flex-basis
      
      se o flex for o padrao "flex = 0 1 auto" pode se usar "flex = initial"

      se o flex for "flex = 0 0 auto" pode se usar "flex = none"

      se o flex for "flex = 1 1 auto" pode se usar "flex = auto"

      se o flex for "flex = 3(pode ser qualquer numero)" ele quer dizer que o valor do grow é 3 então seria "flex = 3 1 auto"
      */
    </style>
  </head>
  <body>
    <div class="conteiner">
      <div class="item" id="i1">A</div>
      <div class="item" id="i2">B</div>
      <div class="item" id="i3">C</div>
    </div>
  </body>
</html>
